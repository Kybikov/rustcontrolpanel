name: rust-control

services:
  gateway:
    build:
      context: ./deploy
      dockerfile: nginx.Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://rust.wtmelon.store}
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-wss://rust.wtmelon.store/api/v1/realtime/ws}
    environment:
      NODE_ENV: production
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: production
      API_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-rustcontrol}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the deployment environment}@postgres:5432/${POSTGRES_DB:-rustcontrol}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://rust.wtmelon.store}
      INTEGRATION_CREDENTIALS_FILE: /run/secrets/rust_control_keys
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://rust.wtmelon.store}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://rust.wtmelon.store}
    secrets:
      - rust_control_keys
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rustcontrol}
      POSTGRES_USER: ${POSTGRES_USER:-rustcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the deployment environment}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rustcontrol} -d ${POSTGRES_DB:-rustcontrol}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:

secrets:
  rust_control_keys:
    environment: RUST_CONTROL_CONFIG
