services:
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-ws://localhost:8080/api/v1/realtime/ws}
    environment:
      NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-ws://localhost:8080/api/v1/realtime/ws}
    ports:
      - "${WEB_HOST_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-rustcontrol}:${POSTGRES_PASSWORD:-rustcontrol}@postgres:5432/${POSTGRES_DB:-rustcontrol}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000},http://localhost:3001"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rustcontrol}
      POSTGRES_USER: ${POSTGRES_USER:-rustcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rustcontrol}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rustcontrol} -d ${POSTGRES_DB:-rustcontrol}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
